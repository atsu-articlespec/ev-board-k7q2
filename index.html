<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>イベントまとめ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=M+PLUS+1p:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap">
<style>
/* 設計: atsumori.net（KITSUNE）の世界観に合わせた、黒地に金と朱の告知ページ。
   日付を大きく見せる日別リスト。ライトテーマは作らない（サイト本体が暗色のため、暗色で固定）。 */
:root {
  --bg: #100e0c;
  --surface: #1e1a16;
  --surface-2: #171410;
  --ink: #f1ecdf;
  --muted: #aea496;
  --gold: #c6aa76;
  --gold-dim: #766344;
  --line: rgba(198, 170, 118, .26);
  --red: #b62816;
  --red-ink: #fff4ef;
  --glow: #2b1510;
  --font: "M PLUS 1p", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  --font-head: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-num: "Cormorant Garamond", "Hiragino Mincho ProN", "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(110% 50% at 50% -8%, var(--glow) 0%, rgba(16,14,12,0) 70%), var(--bg);
  background-color: var(--bg);
  color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* 見出し（サイト本体の「直近のホール情報」と同じ型：左に見出し、右に英字、下に金の罫線） */
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: clamp(22px, 5.4vw, 30px); letter-spacing: .06em; text-wrap: balance; }
.eyebrow { font-size: 11px; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* 絞り込み */
.panel { display: grid; gap: 14px; padding: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.field { display: grid; gap: 5px; min-width: 0; }
.lab, .field > label { font-size: 11px; letter-spacing: .14em; color: var(--gold); }
select, input[type=search] {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 2px; padding: 8px 10px; min-width: 128px; max-width: 100%;
}
input[type=search] { min-width: 240px; }
input::placeholder { color: var(--gold-dim); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); }
.seg button { font: inherit; font-size: 14px; background: transparent; color: var(--muted); border: 0; border-right: 1px solid var(--line); padding: 8px 16px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1a140c; font-weight: 700; }
details.media > summary { cursor: pointer; list-style: none; color: var(--gold); font-size: 12px; letter-spacing: .14em; display: flex; align-items: center; gap: 8px; }
details.media > summary::-webkit-details-marker { display: none; }
details.media > summary::before { content: "＋"; font-size: 13px; }
details.media[open] > summary::before { content: "－"; }
details.media .chips { margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.chip small { color: var(--gold-dim); margin-left: 5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: rgba(198,170,118,.16); border-color: var(--gold); color: var(--ink); }
.chip[aria-pressed="true"] small { color: var(--gold); }
.linkbtn { font: inherit; font-size: 13px; background: none; border: 0; color: var(--gold); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 6px 2px; }

.summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 22px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-family: var(--font-num); font-size: 22px; font-weight: 700; margin-right: 2px; }

/* 日別リスト */
.list { display: grid; gap: 0; }
.day { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 0 20px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.when { display: grid; align-content: start; gap: 2px; }
.when small { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.when .md { font-family: var(--font-num); font-weight: 700; font-size: 44px; line-height: 1; color: var(--gold); font-variant-numeric: lining-nums; letter-spacing: .01em; }
.when .dw { font-size: 12px; letter-spacing: .12em; color: var(--ink); }
.when .badge { justify-self: start; margin-top: 6px; font-size: 10px; letter-spacing: .16em; background: var(--red); color: var(--red-ink); padding: 1px 8px; }
.gh { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 4px; font-family: var(--font-head); font-size: 18px; font-weight: 700; letter-spacing: .06em; color: var(--ink); }
.gh span { font-family: var(--font); font-size: 12px; font-weight: 400; letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.day.plain { display: block; }

.items { list-style: none; margin: 0; padding: 0; display: grid; min-width: 0; }
.st { padding: 13px 0; border-top: 1px solid rgba(198,170,118,.12); min-width: 0; }
.st:first-child { border-top: 0; padding-top: 2px; }
.st-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ev-store { font-family: var(--font-head); font-weight: 700; font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
.ev-when { font-size: 12px; color: var(--gold); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.pl { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
.bl { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 5px; }
.bl li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px; padding-left: 1.1em; position: relative; }
.bl li::before { content: "・"; position: absolute; left: 0; color: var(--gold); }
.bt { color: var(--ink); font-size: 14px; overflow-wrap: anywhere; flex: 1 1 12rem; min-width: 0; }
.tags { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; margin-left: auto; }
.tag { font-size: 11px; letter-spacing: .04em; padding: 0 7px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; line-height: 1.7; }
.tag.visit { background: var(--red); border-color: var(--red); color: var(--red-ink); font-weight: 700; }
.tag.press { border-color: var(--gold-dim); color: var(--gold); }
.more { display: flex; justify-content: center; padding-top: 12px; }
.more button { font: inherit; background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); padding: 8px 22px; cursor: pointer; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); border-bottom: 1px solid var(--line); }
.foot { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 640px) {
  .day { grid-template-columns: 1fr; padding-block: 18px; }
  .when { grid-auto-flow: column; grid-template-columns: auto auto 1fr; align-items: baseline; justify-content: start; gap: 4px 12px; margin-bottom: 8px; }
  .when small { display: none; }
  .when .md { font-size: 34px; }
  .when .badge { margin-top: 0; justify-self: start; }
  input[type=search] { min-width: 100%; }
  .field { flex: 1 1 128px; }
  .field:has(.seg) { flex: 1 1 100%; }
  .seg { display: flex; width: 100%; flex-wrap: nowrap; }
  .seg button { flex: 1 1 0; padding: 9px 6px; }
  select { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { .chip, .seg button, .more button { transition: background .15s, color .15s, border-color .15s; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">Event Schedule</div>
      <h1>直近のイベント情報</h1>
    </div>
    <div class="sub" id="meta"></div>
  </header>

  <section class="panel" aria-label="絞り込み">
    <div class="row">
      <div class="field"><span class="lab">期間</span>
        <div class="seg" id="period" role="group" aria-label="期間">
          <button data-v="future" aria-pressed="true">今日以降</button>
          <button data-v="week" aria-pressed="false">今週（7日）</button>
        </div>
      </div>
      <div class="field"><label for="month">月</label><select id="month"><option value="">すべて</option></select></div>
      <div class="field"><label for="region">地域</label><select id="region"><option value="">すべて</option></select></div>
      <div class="field"><label for="pref">県</label><select id="pref"><option value="">すべて</option></select></div>
      <div class="field"><label for="kind">種別</label><select id="kind"><option value="">すべて</option></select></div>
      <div class="field"><label for="q">店名・企画・演者</label><input type="search" id="q" placeholder="例: マルハン / 虎取材"></div>
    </div>
    <details class="media" id="mediabox">
      <summary>媒体で絞り込む<span id="mediacount"></span></summary>
      <div class="chips" id="media"></div>
    </details>
    <div class="row">
      <div class="field"><span class="lab">並べ方</span>
        <div class="seg" id="group" role="group" aria-label="並べ方">
          <button data-v="date" aria-pressed="true">日付別</button>
          <button data-v="region" aria-pressed="false">地域別</button>
          <button data-v="pref" aria-pressed="false">県別</button>
          <button data-v="media" aria-pressed="false">媒体別</button>
        </div>
      </div>
      <button class="linkbtn" id="reset">絞り込みをクリア</button>
    </div>
  </section>

  <div class="summary" id="summary" aria-live="polite"></div>
  <div class="list" id="list"></div>
  <p class="foot">掲載は各媒体の公開情報をもとにしています。内容が変わることがあるため、来店前に各媒体でご確認ください。</p>
</div>

<script>
(function () {
  var js = "\nconst RAW = window.__RAW__;            // [日付, 県, 店舗, 企画, 演者, 媒体, 種別]\nconst BUILT = window.__BUILT__;\nconst REGION = {福岡県:'九州',佐賀県:'九州',長崎県:'九州',熊本県:'九州',大分県:'九州',宮崎県:'九州',鹿児島県:'九州',沖縄県:'沖縄',\n  鳥取県:'中四国',島根県:'中四国',岡山県:'中四国',広島県:'中四国',山口県:'中四国',徳島県:'中四国',香川県:'中四国',愛媛県:'中四国',高知県:'中四国'};\nconst PREF_ORDER = Object.keys(REGION);\nconst REGION_ORDER = ['九州','沖縄','中四国'];\nconst DOW = ['日','月','火','水','木','金','土'];\nconst DOW_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];\nconst jst = off => new Date(Date.now() + 9*3600e3 + off*86400e3).toISOString().slice(0,10);\nconst TODAY = jst(0), TOMORROW = jst(1), WEEK_END = jst(6);\n\n// 今日より前の予定は載せない\nconst ROWS = RAW.map(r => {\n  const plan = r[3] && r[4] ? r[3] + '（' + r[4] + '）' : (r[3] || r[4]);\n  return { date:r[0], pref:r[1], region:REGION[r[1]]||'', store:r[2], plan, media:r[5], kind:r[6],\n           hay:(r[2]+' '+r[3]+' '+r[4]).toLowerCase() };\n}).filter(r => r.date >= TODAY);\n\nconst PER = 60;\nconst S = { period:'future', month:'', region:'', pref:'', kind:'', q:'', media:new Set(), group:'date', open:new Set() };\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s ?? '').replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst n = v => Number(v).toLocaleString('ja-JP');\nconst dowOf = d => new Date(d + 'T00:00:00+09:00').getDay();\nconst md = d => Number(d.slice(5,7)) + '/' + Number(d.slice(8,10)) + '（' + DOW[dowOf(d)] + '）';\nconst uniq = a => [...new Set(a)];\n\nfunction fillSelect(id, values, label) {\n  $(id).innerHTML = '<option value=\"\">すべて<\/option>' + values.map(v => `<option value=\"${esc(v)}\">${esc(label ? label(v) : v)}<\/option>`).join('');\n}\nfillSelect('month', uniq(ROWS.map(r => r.date.slice(0,7))).sort(), v => v.replace('-', '年') + '月');\nfillSelect('region', REGION_ORDER);\nfillSelect('pref', PREF_ORDER.filter(p => ROWS.some(r => r.pref === p)));\nconst kinds = k => (k || '').split('・').filter(Boolean);\nfillSelect('kind', uniq(ROWS.flatMap(r => kinds(r.kind))).sort());\n\nfunction baseFilter(r) {\n  if (S.period === 'week' && r.date > WEEK_END) return false;\n  if (S.month && r.date.slice(0,7) !== S.month) return false;\n  if (S.region && r.region !== S.region) return false;\n  if (S.pref && r.pref !== S.pref) return false;\n  if (S.kind && !kinds(r.kind).includes(S.kind)) return false;\n  if (S.q && !r.hay.includes(S.q)) return false;\n  return true;\n}\n\nfunction renderChips(base) {\n  const counts = {};\n  base.forEach(r => counts[r.media] = (counts[r.media] || 0) + 1);\n  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);\n  S.media.forEach(m => { if (!(m in counts)) names.push(m); });\n  $('media').innerHTML = names.map(m =>\n    `<button class=\"chip\" data-m=\"${esc(m)}\" aria-pressed=\"${S.media.has(m)}\">${esc(m)}<small>${counts[m] || 0}<\/small><\/button>`).join('')\n    || '<span class=\"sub\">該当なし<\/span>';\n  $('mediacount').textContent = S.media.size ? `（${S.media.size}件選択中）` : '';\n}\n\nconst groupKey = r => S.group === 'media' ? r.media : S.group === 'region' ? (r.region || '不明') : S.group === 'pref' ? r.pref : r.date;\nfunction groupOrder(keys, groups) {\n  if (S.group === 'region') return keys.sort((a, b) => REGION_ORDER.indexOf(a) - REGION_ORDER.indexOf(b));\n  if (S.group === 'pref') return keys.sort((a, b) => PREF_ORDER.indexOf(a) - PREF_ORDER.indexOf(b));\n  if (S.group === 'date') return keys.sort();\n  return keys.sort((a, b) => groups[b].length - groups[a].length);\n}\n\n// 同じ日・同じ店の予定を1つにまとめ、同じ内容（演者の括弧の有無だけが違うもの、別媒体の重複）は1行にして媒体を並べる\nconst planKey = r => (r.plan || '').normalize('NFKC').replace(/[（(][^）)]*[）)]/g, '').replace(/[\\s_]/g, '').toLowerCase();\nfunction blocksOf(rows) {\n  const blocks = new Map();\n  for (const r of rows) {\n    const k = r.date + '|' + r.pref + '|' + r.store;\n    if (!blocks.has(k)) blocks.set(k, { date:r.date, pref:r.pref, store:r.store, items:new Map() });\n    const b = blocks.get(k), ik = r.kind + '|' + (planKey(r) || r.kind);\n    const it = b.items.get(ik);\n    if (!it) b.items.set(ik, { plan:r.plan, kind:r.kind, media:[r.media] });\n    else { if (r.plan.length > it.plan.length) it.plan = r.plan; if (!it.media.includes(r.media)) it.media.push(r.media); }\n  }\n  return [...blocks.values()];\n}\nconst bulletCount = bs => bs.reduce((a, b) => a + b.items.size, 0);\n\nfunction blockHtml(b) {\n  const when = S.group === 'date' ? '' : `<span class=\"ev-when\">${md(b.date)}<\/span>`;\n  const place = S.group === 'pref' ? '' : `<span class=\"pl\">${esc(b.pref)}<\/span>`;\n  const lines = [...b.items.values()].map(it => {\n    const kind = kinds(it.kind).map(k => `<span class=\"tag ${k === '来店' ? 'visit' : 'press'}\">${esc(k)}<\/span>`).join('');\n    const media = S.group === 'media' ? '' : it.media.map(m => `<span class=\"tag\">${esc(m)}<\/span>`).join('');\n    return `<li><span class=\"bt\">${esc(it.plan || kinds(it.kind).join('・'))}<\/span><span class=\"tags\">${media}${kind}<\/span><\/li>`;\n  }).join('');\n  return `<li class=\"st\"><div class=\"st-head\"><span class=\"ev-store\">${esc(b.store)}<\/span>${place}${when}<\/div><ul class=\"bl\">${lines}<\/ul><\/li>`;\n}\n\nfunction whenHtml(d) {\n  const w = dowOf(d);\n  const badge = d === TODAY ? '<span class=\"badge\">TODAY<\/span>' : d === TOMORROW ? '<span class=\"badge\">TOMORROW<\/span>' : '';\n  return `<div class=\"when\"><small>${d.slice(0,4)}<\/small><span class=\"md\">${Number(d.slice(5,7))}.${String(Number(d.slice(8,10))).padStart(2,'0')}<\/span><span class=\"dw\">${DOW_EN[w]} ${DOW[w]}曜日<\/span>${badge}<\/div>`;\n}\n\nfunction render() {\n  const base = ROWS.filter(baseFilter);\n  renderChips(base);\n  const rows = (S.media.size ? base.filter(r => S.media.has(r.media)) : base)\n    .sort((a, b) => a.date.localeCompare(b.date) || PREF_ORDER.indexOf(a.pref) - PREF_ORDER.indexOf(b.pref) || a.store.localeCompare(b.store, 'ja'));\n\n  const stores = new Set(rows.map(r => r.pref + r.store)).size;\n  const total = bulletCount(blocksOf(rows));\n  $('summary').innerHTML = `<span><b>${n(total)}<\/b>件<\/span><span><b>${n(stores)}<\/b>店舗<\/span>`\n    + (rows.length ? `<span>${md(rows[0].date)} 〜 ${md(rows[rows.length-1].date)}<\/span>` : '');\n\n  if (!rows.length) { $('list').innerHTML = '<div class=\"empty\">この条件に合う予定はありません。期間や県を変えてみてください。<\/div>'; return; }\n\n  const groups = {};\n  rows.forEach(r => (groups[groupKey(r)] = groups[groupKey(r)] || []).push(r));\n  const keys = groupOrder(Object.keys(groups), groups);\n\n  let html = '';\n  for (const k of keys) {\n    const all = blocksOf(groups[k]), open = S.open.has(k), shown = open ? all : all.slice(0, PER);\n    const more = shown.length < all.length\n      ? `<div class=\"more\"><button data-open=\"${esc(k)}\">残り ${n(all.length - shown.length)} 店を表示<\/button><\/div>` : '';\n    const list = `<ul class=\"items\">${shown.map(blockHtml).join('')}<\/ul>${more}`;\n    html += S.group === 'date'\n      ? `<section class=\"day\">${whenHtml(k)}<div>${list}<\/div><\/section>`\n      : `<section class=\"day plain\"><h2 class=\"gh\">${esc(k)}<span>${n(bulletCount(all))}件<\/span><\/h2>${list}<\/section>`;\n  }\n  $('list').innerHTML = html;\n}\n\nfunction bindSeg(id, key) {\n  $(id).addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    S[key] = b.dataset.v; S.open.clear();\n    [...$(id).children].forEach(x => x.setAttribute('aria-pressed', x === b));\n    render();\n  });\n}\nbindSeg('period', 'period'); bindSeg('group', 'group');\n['month','region','pref','kind'].forEach(k => $(k).addEventListener('change', e => { S[k] = e.target.value; S.open.clear(); render(); }));\n$('q').addEventListener('input', e => { S.q = e.target.value.trim().toLowerCase(); S.open.clear(); render(); });\n$('media').addEventListener('click', e => {\n  const b = e.target.closest('.chip'); if (!b) return;\n  const m = b.dataset.m; S.media.has(m) ? S.media.delete(m) : S.media.add(m); S.open.clear(); render();\n});\n$('list').addEventListener('click', e => { const k = e.target.dataset && e.target.dataset.open; if (k) { S.open.add(k); render(); } });\n$('reset').addEventListener('click', () => {\n  Object.assign(S, { period:'future', month:'', region:'', pref:'', kind:'', q:'' }); S.media.clear(); S.open.clear();\n  ['month','region','pref','kind'].forEach(k => $(k).value = ''); $('q').value = '';\n  [...$('period').children].forEach(x => x.setAttribute('aria-pressed', x.dataset.v === 'future'));\n  render();\n});\n\n$('meta').textContent = `更新 ${BUILT}`;\nrender();\n\n";
  function fail() { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:24px;color:#f1ecdf">読み込めませんでした。時間をおいて再読み込みしてください。</p>'); }
  fetch('events.json?t=' + Math.floor(Date.now() / 300000), { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { window.__RAW__ = d.events; window.__BUILT__ = d.built; var s = document.createElement('script'); s.text = js; document.body.appendChild(s); })
    .catch(fail);
})();
</script>

</body>
</html>
